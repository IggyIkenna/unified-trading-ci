name: Staging Lock Check

on:
  workflow_call:
    inputs:
      self_hosted_runner_labels:
        description: 'JSON array of runner labels. Empty = ubuntu-latest.'
        type: string
        default: ""
    secrets:
      GH_PAT:
        required: false

permissions:
  contents: read

jobs:
  check-staging-lock:
    name: check-staging-lock
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
